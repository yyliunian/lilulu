  <style>
/*
 * 工业制造产线大模型高效训练与部署软件 V1.0
 * 扩展交互样式。基础视觉变量与整体布局沿用 index.html 原有设计。
 */

.subnav {
  display: flex;
  gap: 5px;
  margin: 0 0 18px;
  padding: 5px;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  scrollbar-width: thin;
}

.subnav button {
  flex: 0 0 auto;
  min-height: 34px;
  padding: 7px 11px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: #607086;
  font-size: .75rem;
  white-space: nowrap;
}

.subnav button:hover {
  background: #f3f7fb;
  color: var(--blue);
}

.subnav button.active {
  border-color: #c9dced;
  background: #eaf3fb;
  color: #1f5d96;
  font-weight: 650;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 13px;
}

.section-head h3 {
  margin: 0;
  font-size: 1rem;
}

.section-head p {
  max-width: 880px;
  margin: 4px 0 0;
  color: var(--muted);
  font-size: .77rem;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 13px 15px;
  border-bottom: 1px solid #e9eef3;
  background: #fcfdfe;
}

.toolbar .searchbox {
  position: relative;
  flex: 1 1 240px;
  max-width: 390px;
}

.toolbar .searchbox input {
  width: 100%;
  padding-left: 32px;
}

.toolbar .searchbox::before {
  content: "⌕";
  position: absolute;
  left: 11px;
  top: 7px;
  color: #7b8ba0;
  font-size: 1rem;
  pointer-events: none;
}

.toolbar-spacer {
  flex: 1 1 auto;
}

.btn.danger {
  border-color: #e7c8c8;
  background: #fffafa;
  color: var(--red);
}

.btn.success {
  border-color: #bcdacd;
  background: #f4fbf8;
  color: var(--green);
}

.btn.small {
  min-height: 30px;
  padding: 5px 9px;
  font-size: .72rem;
}

.row-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  white-space: nowrap;
}

.linkbtn {
  min-width: 28px;
  min-height: 27px;
  padding: 3px 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--blue);
  font-size: .7rem;
}

.linkbtn:hover {
  background: #eaf3fb;
}

.linkbtn.delete {
  color: var(--red);
}

.linkbtn.delete:hover {
  background: #fff0f0;
}

.sortable {
  cursor: pointer;
  user-select: none;
}

.sortable::after {
  content: " ↕";
  color: #a3afbd;
  font-size: .62rem;
}

.sortable.asc::after {
  content: " ↑";
  color: var(--blue);
}

.sortable.desc::after {
  content: " ↓";
  color: var(--blue);
}

.empty {
  display: grid;
  place-items: center;
  min-height: 270px;
  padding: 42px;
  text-align: center;
}

.empty-mark {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
  border: 1px solid #cedae7;
  border-radius: 50%;
  background: #f5f9fc;
  color: #7890a8;
  font-size: 1.1rem;
}

.empty h4 {
  margin: 0 0 4px;
  font-size: .88rem;
}

.empty p {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: .74rem;
}

.record-count {
  color: var(--muted);
  font-size: .71rem;
}

.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 15px;
  border-top: 1px solid #edf1f5;
  color: var(--muted);
  font-size: .7rem;
}

.pager-controls {
  display: flex;
  gap: 4px;
}

.pagebtn {
  min-width: 30px;
  height: 29px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
  color: #4c5d73;
  font-size: .7rem;
}

.pagebtn.active {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}

.pagebtn:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.detail-item {
  min-height: 62px;
  padding: 11px 12px;
  border: 1px solid #e3e9ef;
  border-radius: 5px;
  background: #fbfcfd;
}

.detail-item small {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: .66rem;
}

.detail-item b {
  display: block;
  overflow-wrap: anywhere;
  font-size: .78rem;
  font-weight: 600;
}

.notice {
  padding: 11px 13px;
  border: 1px solid #d5e4f0;
  border-radius: 5px;
  background: #f6faff;
  color: #53677e;
  font-size: .73rem;
}

.notice.warning {
  border-color: #ecd8ad;
  background: #fffbf2;
  color: #7e632d;
}

.notice.error {
  border-color: #eccaca;
  background: #fff7f7;
  color: #8e4a4a;
}

.progress-line {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 128px;
}

.progress-line .bar {
  flex: 1;
}

.progress-line span {
  min-width: 34px;
  color: var(--muted);
  font-size: .67rem;
  text-align: right;
}

.split-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(280px, .75fr);
  gap: 15px;
}

.side-panel {
  padding: 15px;
}

.side-panel h4 {
  margin: 0 0 12px;
  font-size: .86rem;
}

.timeline {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

.timeline li {
  position: relative;
  padding: 0 0 15px 23px;
  color: #43536a;
  font-size: .73rem;
}

.timeline li::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 5px;
  width: 7px;
  height: 7px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 0 1px #8eabc7;
}

.timeline li::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 16px;
  bottom: 0;
  width: 1px;
  background: #d9e2eb;
}

.timeline li:last-child::after {
  display: none;
}

.timeline time {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: .64rem;
}

.form-section {
  grid-column: 1 / -1;
  margin: 4px 0 -2px;
  padding-bottom: 7px;
  border-bottom: 1px solid #e8edf2;
  color: #294f76;
  font-size: .76rem;
  font-weight: 700;
}

.field textarea {
  min-height: 84px;
  padding: 8px 9px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 5px;
}

.field .checkline {
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
}

.field .checkline input {
  width: 16px;
  height: 16px;
}

.field .help {
  color: var(--muted);
  font-size: .65rem;
}

.required::after {
  content: " *";
  color: var(--red);
}

.invalid {
  border-color: var(--red) !important;
  box-shadow: 0 0 0 2px #b4434312;
}

.modal.wide {
  width: min(820px, 100%);
}

.modalhead .modal-subtitle {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: .68rem;
}

.modalfoot .left-note {
  margin-right: auto;
  color: var(--muted);
  font-size: .67rem;
}

.drawer {
  position: fixed;
  z-index: 45;
  inset: var(--top) 0 0 auto;
  width: min(520px, 100vw);
  padding: 18px;
  overflow: auto;
  border-left: 1px solid var(--line);
  background: #fff;
  box-shadow: -20px 0 50px #0d213b1a;
  transform: translateX(105%);
  transition: transform .22s ease;
}

.drawer.open {
  transform: none;
}

.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.drawer-head h3 {
  margin: 0;
  font-size: 1rem;
}

.drawer-head p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: .7rem;
}

.drawer-section {
  margin-top: 17px;
}

.drawer-section h4 {
  margin: 0 0 8px;
  font-size: .8rem;
}

.json-preview {
  max-height: 260px;
  margin: 0;
  padding: 12px;
  overflow: auto;
  border: 1px solid #dce4ec;
  border-radius: 5px;
  background: #f6f8fa;
  color: #33485f;
  font: .7rem/1.55 Consolas, "Microsoft YaHei", monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.system-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  padding: 17px;
}

.system-form .full {
  grid-column: 1 / -1;
}

.api-key {
  max-width: 260px;
  overflow: hidden;
  color: #3e536b;
  font: .7rem Consolas, monospace;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  border-radius: 50%;

      if (field.key === "name") {
        record[field.key] = `${submodule.title}示例 ${index + 1}`;
      } else if (field.key === "code") {
        record[field.key] = `${submodule.key.replaceAll(/[^a-zA-Z0-9]/g, "").slice(0, 6).toUpperCase()}-${String(index + 1).padStart(3, "0")}`;
      } else if (field.type === "select") {
        record[field.key] = field.options[index % field.options.length];
      } else if (field.type === "number") {
        if (field.key.toLowerCase().includes("progress")) {
          record[field.key] = index ? 100 : 68;
        } else if (field.key.toLowerCase().includes("rate") || field.key.toLowerCase().includes("score") || field.key.toLowerCase().includes("accuracy")) {
          record[field.key] = index ? 96.4 : 98.2;
        } else if (field.key.toLowerCase().includes("latency") || field.key.toLowerCase().includes("ms")) {
          record[field.key] = index ? 472 : 386;
        } else {
          record[field.key] = Math.max(field.min ?? 0, index + 1);
        }
      } else if (field.type === "checkbox") {
        record[field.key] = index === 0;
      } else if (field.key === "description") {
        record[field.key] = `${submodule.title}的示例业务记录，可进行编辑、复制、状态调整和删除。`;

  const buildDefaultState = () => {

        collections[submodule.collection] = seedOverrides[submodule.collection]

      return "ok running";

    if (/失败|异常|不通过|不兼容|离线|严重|紧急|错误|校验失败|未达标|锁定/.test(text)) {
      return "bad failed";

    if (/等待|暂停|草稿|检查|评测|测试|复核|灰度|提醒|警告|待|维护|调度|转换|迁移|部署|发布|处理中|组织中|标注中/.test(text)) {

      case "tag":
        return tagHtml(value, "blue");

        return statusHtml(value);
      case "progress":
        return progressHtml(value);
      case "percent":
        return `${escapeHtml(value ?? "-")}${value === "" || value === null || value === undefined ? "" : "%"}`;
      case "score": {
        const score = Number(value);
        const tone = Number.isFinite(score) && score >= 90 ? "green" : Number.isFinite(score) && score < 60 ? "amber" : "blue";
        return tagHtml(value ?? "-", tone);
      }
      case "latency":
        return `${escapeHtml(value ?? "-")}${value === "" || value === null || value === undefined ? "" : " ms"}`;
      case "temperature":
        return `${escapeHtml(value ?? "-")}${value === "" || value === null || value === undefined ? "" : " ℃"}`;

        return `${escapeHtml(value ?? "-")}${typeof value === "number" ? " GB" : ""}`;

        return value ? tagHtml("是", "green") : tagHtml("否");

        return `<span class="api-key" title="${escapeHtml(value || "")}">${escapeHtml(value || "未生成")}</span>`;
      case "level": {
        const tone = /严重|紧急|ERROR|高风险/.test(value) ? "amber" : /信息|正常|INFO/.test(value) ? "green" : "blue";
        return tagHtml(value, tone);

      records = records.filter((record) => String(record.status) === ui.statusFilter);
    }

    const { sortKey, sortDirection } = ui;
    records.sort((left, right) => {
      const leftValue = left[sortKey] ?? "";
      const rightValue = right[sortKey] ?? "";
      const leftNumber = Number(leftValue);
      const rightNumber = Number(rightValue);
      let result;

      if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber) && leftValue !== "" && rightValue !== "") {
        result = leftNumber - rightNumber;
      } else {
        result = String(leftValue).localeCompare(String(rightValue), "zh-CN", { numeric: true });

      return sortDirection === "asc" ? result : -result;
    });

  const renderApi = (submodule) => `

POST /api/v1/models/import
GET  /api/v1/models

      case "resources":

      case "models":

      case "imports":

      case "inference":
        return renderInference(submodule);
      case "settings":
        return renderSettings();
      case "api":
        return renderApi(submodule);
      default:
        return renderTable(submodule);
    }
  };

  const render = () => {
    const module = getModule();
    if (module.key !== ui.moduleKey) {
      ui.moduleKey = module.key;
    }

    const submodule = getSubmodule(module);
    if (submodule.key !== ui.subKey) {
      ui.subKey = submodule.key;
    }

    renderNavigation();
    dom.main.innerHTML = [
      renderPageHeader(module, submodule),
      renderSubNavigation(module, submodule),
      renderSubmoduleHeading(submodule),
      renderSubmoduleContent(submodule)
    ].join("");

    bindDynamicInputs();
    saveUiState();
  };

  /* ================================================================
   *  新建、编辑、删除、导入、导出与任务控制
   * ================================================================ */

  const showToast = (message, duration = 2600) => {
    clearTimeout(toastTimer);
    dom.toast.textContent = message;
    dom.toast.classList.add("show");
    toastTimer = setTimeout(() => {
      dom.toast.classList.remove("show");
    }, duration);
  };

  const ensureAuxiliaryDom = () => {
    if (!document.getElementById("drawer")) {
      const drawer = document.createElement("aside");
      drawer.id = "drawer";
      drawer.className = "drawer";
      drawer.setAttribute("aria-hidden", "true");
      document.body.appendChild(drawer);
    }

    if (!document.getElementById("importFile")) {
      const fileInput = document.createElement("input");
      fileInput.id = "importFile";
      fileInput.type = "file";
      fileInput.accept = ".json,.jsonl,.csv,text/csv,application/json";
      fileInput.hidden = true;
      document.body.appendChild(fileInput);
      fileInput.addEventListener("change", async () => {
        const [file] = fileInput.files || [];
        if (file) {
          await importFile(file);
        }
        fileInput.value = "";
      });
    }

    if (!$(".modal-subtitle", dom.modal)) {
      const heading = $(".modalhead > div", dom.modal);
      if (!heading) {
        const title = dom.modalTitle;
        const wrapper = document.createElement("div");
        title.parentNode.insertBefore(wrapper, title);
        wrapper.appendChild(title);
        const subtitle = document.createElement("p");
        subtitle.className = "modal-subtitle";
        subtitle.id = "modalSubtitle";
        wrapper.appendChild(subtitle);
      }
    }

    if (!$(".left-note", dom.modal)) {
      const note = document.createElement("span");
      note.className = "left-note";
      note.textContent = "带 * 的字段为必填项";
      $(".modalfoot", dom.modal).insertBefore(note, dom.modalCancel);
    }
  };

  const closeModal = () => {
    dom.modalBackdrop.classList.remove("open");
    dom.modal.classList.remove("wide");
    dom.modalForm.innerHTML = "";
    ui.editingId = null;
    ui.activeCollection = null;
    document.body.style.overflow = "";
  };

  const fieldInputHtml = (field, value) => {
    const id = `field-${field.key}`;
    const requiredClass = field.required ? "required" : "";
    const currentValue = value ?? "";
    const fullClass = field.full ? "full" : "";

    let input;

    if (field.type === "select") {
      input = `
        <select id="${id}" name="${field.key}" ${field.required ? "required" : ""}>
          <option value="">请选择</option>
          ${field.options.map((option) => `
            <option value="${escapeHtml(option)}" ${String(option) === String(currentValue) ? "selected" : ""}>${escapeHtml(option)}</option>
          `).join("")}
        </select>
      `;
    } else if (field.type === "textarea") {
      input = `
        <textarea
          id="${id}"
          name="${field.key}"
          placeholder="${escapeHtml(field.placeholder || "")}"
          ${field.required ? "required" : ""}
        >${escapeHtml(currentValue)}</textarea>
      `;
    } else if (field.type === "checkbox") {
      input = `
        <label class="checkline">
          <input id="${id}" name="${field.key}" type="checkbox" ${currentValue ? "checked" : ""}>
          <span>启用该选项</span>
        </label>
      `;
    } else {
      input = `
        <input
          id="${id}"
          name="${field.key}"
          type="${field.type || "text"}"
          value="${escapeHtml(currentValue)}"
          placeholder="${escapeHtml(field.placeholder || "")}"
          ${field.required ? "required" : ""}
          ${field.min !== undefined ? `min="${field.min}"` : ""}
          ${field.max !== undefined ? `max="${field.max}"` : ""}
          ${field.step !== undefined ? `step="${field.step}"` : ""}
        >
      `;
    }

    return `
      <div class="field ${fullClass}">
        <label class="${requiredClass}" for="${id}">${escapeHtml(field.label)}</label>
        ${input}
        ${field.help ? `<span class="help">${escapeHtml(field.help)}</span>` : ""}
      </div>
    `;
  };

  const openRecordModal = (mode, id = null) => {
    const submodule = getSubmodule();
    const records = getRecords(submodule);
    const sourceRecord = id ? records.find((record) => record.id === id) : null;

    ui.modalMode = mode;
    ui.editingId = sourceRecord?.id || null;
    ui.activeCollection = submodule.collection;

    const record = mode === "duplicate" && sourceRecord
      ? {
          ...sourceRecord,
          id: undefined,
          name: `${sourceRecord.name || submodule.title}（副本）`,
          code: `${sourceRecord.code || "COPY"}-COPY`
        }
      : sourceRecord || {};

    const actionLabel = mode === "edit"
      ? `编辑${submodule.title}`
      : mode === "duplicate"
        ? `复制${submodule.title}`
        : submodule.action;

    dom.modalTitle.textContent = actionLabel;
    const subtitle = document.getElementById("modalSubtitle");
    if (subtitle) {
      subtitle.textContent = `${getModule().title} / ${submodule.title}`;
    }
    dom.modalSubmit.textContent = mode === "edit" ? "保存修改" : "确认创建";
    dom.modalForm.innerHTML = submodule.fields.map((field) => fieldInputHtml(field, record[field.key])).join("");
    dom.modal.classList.toggle("wide", submodule.fields.length > 8);
    dom.modalBackdrop.classList.add("open");
    document.body.style.overflow = "hidden";

    requestAnimationFrame(() => {
      const firstInput = $("input:not([type=checkbox]), select, textarea", dom.modalForm);
      firstInput?.focus();
    });
  };

  const formToRecord = (submodule) => {
    const record = {};
    let valid = true;
    let firstInvalid = null;

    submodule.fields.forEach((field) => {
      const input = dom.modalForm.querySelector(`[name="${field.key}"]`);
      if (!input) {
        return;
      }

      input.classList.remove("invalid");
      let value;

      if (field.type === "checkbox") {
        value = input.checked;
      } else if (field.type === "number") {
        value = input.value === "" ? "" : Number(input.value);
      } else {
        value = input.value.trim();
      }

      if (field.required && (value === "" || value === null || value === undefined)) {
        valid = false;
        input.classList.add("invalid");
        firstInvalid ||= input;
      }

      record[field.key] = value;
    });

    if (!valid) {
      firstInvalid?.focus();
      showToast("请完整填写所有必填字段。", 3000);
      return null;
    }

    return record;
  };

  const generateApiToken = () => {
    const bytes = new Uint8Array(24);
    if (window.crypto?.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (let index = 0; index < bytes.length; index += 1) {
        bytes[index] = Math.floor(Math.random() * 256);
      }
    }
    return `imsk_${Array.from(bytes).map((byte) => byte.toString(16).padStart(2, "0")).join("")}`;
  };

  const recordAudit = (action, object, result = "成功", risk = "普通") => {
    state.collections.audits ||= [];
    state.collections.audits.unshift({
      id: makeId("AUD"),
      name: `${action}${object}`,
      code: makeId("AUDIT"),
      operator: "高训",
      action,
      object,
      risk,
      status: result,
      description: `通过系统界面执行${action}操作。`,
      updatedAt: nowText()
    });
  };

  const submitRecord = () => {
    const submodule = getSubmodule();
    const recordData = formToRecord(submodule);
    if (!recordData) {
      return;
    }

    const records = getRecords(submodule);

    if (ui.modalMode === "edit") {
      const index = records.findIndex((record) => record.id === ui.editingId);
      if (index < 0) {
        showToast("未找到需要编辑的记录。", 3000);
        closeModal();
        return;
      }

      records[index] = {
        ...records[index],
        ...recordData,
        updatedAt: nowText()
      };
      recordAudit("修改", records[index].name || submodule.title);
      showToast(`${submodule.title}已保存。`);
    } else {
      const record = {
        id: makeId(submodule.key.slice(0, 6).toUpperCase()),
        ...recordData,
        updatedAt: nowText()
      };

      if (submodule.collection === "apiKeys") {
        const rawToken = generateApiToken();
        record.rawToken = rawToken;
        record.token = `${rawToken.slice(0, 12)}••••••••${rawToken.slice(-4)}`;
        record.calls = 0;
      }

      if (submodule.collection === "users") {
        record.lastLogin = "尚未登录";

  const resolveRunningStatus = (submodule) => {
    const key = submodule.key;
    if (/Evals|evaluation/i.test(key)) return "评测中";
    if (/Checks|environment/i.test(key)) return "检查中";
    if (/Imports/i.test(key)) return "运行中";
    if (/modelPackages/i.test(key)) return "转换中";
    if (/deployments/i.test(key)) return "部署中";
    if (/releaseRecords/i.test(key)) return "发布中";

  const toggleRunState = (id) => {
    const submodule = getSubmodule();
    const record = getRecords(submodule).find((item) => item.id === id);
    if (!record) {
      return;
    }

    if (submodule.collection === "endpoints") {
      record.status = record.status === "运行中" ? "已停止" : "运行中";
      recordAudit(record.status === "运行中" ? "启动" : "停止", record.name, "成功", "重要");
    } else if (/运行|进行|部署中|转换中|发布中|回放中|检查中|评测中|测试中/.test(record.status)) {
      record.status = "已暂停";
      recordAudit("暂停", record.name);
    } else {
      if (Number(record.progress) >= 100) {
        record.progress = 0;
      }
      record.status = resolveRunningStatus(submodule);
      recordAudit("启动", record.name);
    }

    record.updatedAt = nowText();
    saveState();
    showToast(`${record.name}：${record.status}`);
    render();
  };

  const csvEscape = (value) => {
    const text = String(value ?? "");
    if (/[",\n\r]/.test(text)) {
      return `"${text.replaceAll('"', '""')}"`;
    }
    return text;
  };

  const downloadFile = (filename, content, type = "text/plain;charset=utf-8") => {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const exportCsv = () => {
    const submodule = getSubmodule();
    const records = getFilteredRecords(submodule);
    const keys = [...new Set(records.flatMap((record) => Object.keys(record).filter((key) => key !== "rawToken")))];
    const headerLabels = Object.fromEntries(submodule.fields.map((field) => [field.key, field.label]));
    const rows = [
      keys.map((key) => csvEscape(headerLabels[key] || key)).join(","),
      ...records.map((record) => keys.map((key) => csvEscape(record[key])).join(","))
    ];
    downloadFile(`${submodule.title}-${todayText()}.csv`, `\uFEFF${rows.join("\r\n")}`, "text/csv;charset=utf-8");
    recordAudit("导出", `${submodule.title} CSV`);
    saveState();
    showToast(`已导出 ${records.length} 条记录。`);
  };

  const exportModuleData = () => {
    const module = getModule();
    const payload = {
      software: APP_NAME,
      module: module.title,
      exportedAt: nowText(),
      data: Object.fromEntries(module.subs
        .filter((submodule) => submodule.collection && submodule.collection !== "settings")
        .map((submodule) => [submodule.title, deepClone(getRecords(submodule)).map((record) => ({ ...record, rawToken: undefined }))]))
    };
    downloadFile(`${module.title}-模块数据-${todayText()}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
    recordAudit("导出", `${module.title}模块数据`);
    saveState();
    showToast(`${module.title}模块数据已导出。`);
  };

  const exportModuleReport = () => {
    const module = getModule();
    const lines = [
      APP_NAME,
      `${module.title}模块功能说明报告`,
      `生成时间：${nowText()}`,
      `模块编号：${module.code}`,
      "",
      "一、模块定位",
      module.description,
      "",
      "二、子模块及功能"
    ];

    module.subs.forEach((submodule, index) => {
      lines.push("");
      lines.push(`${index + 1}. ${submodule.title}`);
      lines.push(`功能定位：${submodule.description}`);

      submodule.features.forEach((feature, featureIndex) => {
        lines.push(`  ${featureIndex + 1}) ${feature}`);

    downloadFile(`${module.title}-功能说明报告-${todayText()}.txt`, `\uFEFF${lines.join("\r\n")}`);
    recordAudit("导出", `${module.title}功能说明报告`);
    saveState();
    showToast(`${module.title}功能说明报告已生成。`);

  const parseCsvLine = (line) => {
    const values = [];
    let current = "";
    let inQuotes = false;

    for (let index = 0; index < line.length; index += 1) {
      const character = line[index];
      const nextCharacter = line[index + 1];

      if (character === '"' && inQuotes && nextCharacter === '"') {
        current += '"';
        index += 1;
      } else if (character === '"') {
        inQuotes = !inQuotes;
      } else if (character === "," && !inQuotes) {
        values.push(current);
        current = "";
      } else {
        current += character;
      }
    }

    values.push(current);
    return values;
  };

  const parseImportedContent = (file, text) => {
    const extension = file.name.split(".").pop().toLowerCase();

    if (extension === "json") {
      const parsed = JSON.parse(text);
      return Array.isArray(parsed) ? parsed : Array.isArray(parsed.data) ? parsed.data : [parsed];
    }

    if (extension === "jsonl") {
      return text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => JSON.parse(line));
    }

    if (extension === "csv") {
      const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter((line) => line.trim());
      if (!lines.length) {
        return [];
      }
      const headers = parseCsvLine(lines[0]);
      return lines.slice(1).map((line) => {
        const values = parseCsvLine(line);
        return Object.fromEntries(headers.map((header, index) => [header.trim(), values[index] ?? ""]));
      });
    }

    throw new Error("仅支持 JSON、JSONL 和 CSV 文件。");
  };

  const normalizeImportedRecord = (source, submodule) => {
    const labelToKey = Object.fromEntries(submodule.fields.map((field) => [field.label, field.key]));
    const record = {
      id: source.id || makeId(submodule.key.slice(0, 6).toUpperCase()),
      updatedAt: nowText()
    };

    Object.entries(source).forEach(([key, value]) => {
      const normalizedKey = labelToKey[key] || key;
      if (normalizedKey !== "rawToken") {
        record[normalizedKey] = value;
      }
    });

    submodule.fields.forEach((field) => {
      if (record[field.key] === undefined) {
        if (field.key === "name") record[field.key] = `导入的${submodule.title}`;
        if (field.key === "code") record[field.key] = makeId("IMP");
        if (field.key === "status") record[field.key] = field.options?.[0] || "已导入";
      }
    });

    return record;
  };

  const importFile = async (file) => {
    const submodule = getSubmodule();
    try {
      const text = await file.text();

      if (submodule.collection === "dataImports") {
        const task = {
          id: makeId("IMPORT"),
          name: `导入 ${file.name}`,
          code: makeId("IMP"),
          sourceType: "本地文件",
          source: file.name,
          format: file.name.split(".").pop().toUpperCase(),
          progress: 100,
          status: "已完成",
          owner: "高训",
          description: `已读取 ${(file.size / 1024).toFixed(1)} KB，本地校验完成。`,
          updatedAt: nowText()
        };
        getRecords(submodule).unshift(task);
        recordAudit("导入", file.name);
        saveState();
        showToast(`文件 ${file.name} 已登记为导入任务。`);
        render();
        return;
      }

      const records = parseImportedContent(file, text);
      if (!records.length) {
        throw new Error("文件中没有可导入记录。");
      }

      const normalized = records.map((record) => normalizeImportedRecord(record, submodule));
      state.collections[submodule.collection].unshift(...normalized);
      recordAudit("导入", `${file.name}（${normalized.length} 条）`);
      saveState();
      ui.page = 1;
      showToast(`成功从 ${file.name} 导入 ${normalized.length} 条记录。`, 3500);
      render();
    } catch (error) {
      console.error(error);
      showToast(`导入失败：${error.message}`, 4500);
    }
  };

  const copyText = async (text) => {
    if (!text) {
      throw new Error("没有可复制的内容");
    }

    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }

    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();
  };

  const copyApiKey = async (id) => {
    const record = (state.collections.apiKeys || []).find((item) => item.id === id);
    if (!record) {
      return;
    }

    try {
      await copyText(record.rawToken || record.token);
      showToast(record.rawToken ? "完整 API 密钥已复制。" : "仅保存了掩码，已复制掩码内容。", 3200);
    } catch (error) {
      showToast(`复制失败：${error.message}`, 3500);
    }
  };

  const saveSettings = () => {
    const form = document.getElementById("systemSettingsForm");
    if (!form) {
      return;
    }

    if (!form.reportValidity()) {
      return;
    }

    const data = new FormData(form);
    state.settings = {
      ...state.settings,
      systemName: String(data.get("systemName") || "").trim(),
      organization: String(data.get("organization") || "").trim(),
      timezone: data.get("timezone"),
      timeFormat: data.get("timeFormat"),
      defaultTrainingQueue: data.get("defaultTrainingQueue"),
      defaultEvaluationBackend: data.get("defaultEvaluationBackend"),
      defaultDeploymentEnvironment: data.get("defaultDeploymentEnvironment"),
      modelRetentionDays: Number(data.get("modelRetentionDays")),
      logRetentionDays: Number(data.get("logRetentionDays")),
      checkpointRetentionDays: Number(data.get("checkpointRetentionDays")),
      reportRetentionDays: Number(data.get("reportRetentionDays")),
      enableAudit: data.get("enableAudit") === "on",
      enableDangerConfirm: data.get("enableDangerConfirm") === "on",
      updatedAt: nowText()
    };
    recordAudit("修改", "全局系统设置", "成功", "重要");
    saveState();

    state.settings = buildDefaultState().settings;

    saveState();

  const runInference = () => {
    const promptInput = document.getElementById("inferencePrompt");
    const endpointSelect = document.getElementById("inferenceEndpoint");
    const result = document.getElementById("inferenceResult");
    const button = $("[data-action='infer']", dom.main);

    if (!promptInput || !endpointSelect || !result || !button) {
      return;
    }

    const prompt = promptInput.value.trim();
    if (!prompt) {
      promptInput.focus();
      showToast("请输入需要分析的工业任务内容。");
      return;
    }

    const endpoint = (state.collections.endpoints || []).find((item) => item.id === endpointSelect.value);
    if (!endpoint || endpoint.status === "已停止" || endpoint.status === "异常") {
      showToast("所选推理端点当前不可用。", 3200);
      return;
    }

    clearTimeout(inferenceTimer);
    button.disabled = true;
    button.textContent = "推理中...";
    result.textContent = "正在完成请求鉴权、动态适配器加载与工业知识推理...";

    const start = performance.now();
    inferenceTimer = setTimeout(() => {
      const elapsed = Math.round(performance.now() - start);
      const simulatedLatency = Math.max(185, Math.min(498, Number(endpoint.latency || elapsed)));
      const response = [
        "分析结论：发泡工位的振动幅值在近 30 分钟持续升高，并与温控偏差同步出现。",
        "",
        "可能原因：",
        "1. 发泡夹具紧固状态发生变化，导致周期性机械振动；",
        "2. 温控回路反馈延迟，使材料黏度与设备负载出现波动；",
        "3. 当前趋势尚未达到停线阈值，但继续运行可能扩大质量偏差。",
        "",
        "处置建议：在下一生产节拍前检查夹具紧固状态和温控回路，完成二次振动采样；若峰值继续上升，应切换备用工位并创建维护工单。",
        "",
        `服务端点：${endpoint.path}`,
        `模型版本：${endpoint.model}`,
        `首 Token 时延：${simulatedLatency} ms · 总耗时：${Math.max(elapsed, simulatedLatency + 620)} ms`
      ];

      result.textContent = response.join("\n");
      button.disabled = false;
      button.textContent = "发送测试";
      endpoint.qps = Number((Number(endpoint.qps || 0) + 0.1).toFixed(1));
      endpoint.updatedAt = nowText();
      recordAudit("调用", `${endpoint.name} 在线推理`);
      saveState();
    }, 900);
  };

  const clearInference = () => {
    const prompt = document.getElementById("inferencePrompt");
    const result = document.getElementById("inferenceResult");
    if (prompt) prompt.value = "";
    if (result) result.textContent = "等待发送测试请求。";
    prompt?.focus();
  };

  const bindDynamicInputs = () => {
    const search = document.getElementById("recordSearch");
    const statusFilter = document.getElementById("statusFilter");
    const dropzone = document.getElementById("dropzone");

    if (search) {
      search.addEventListener("input", () => {
        ui.query = search.value;
        ui.page = 1;
        const selectionStart = search.selectionStart;
        render();
        const nextSearch = document.getElementById("recordSearch");
        nextSearch?.focus();
        nextSearch?.setSelectionRange(selectionStart, selectionStart);
      });
    }

    if (statusFilter) {
      statusFilter.addEventListener("change", () => {
        ui.statusFilter = statusFilter.value;
        ui.page = 1;
        render();
      });
    }

    if (dropzone) {
      ["dragenter", "dragover"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add("dragover");
        });
      });
      ["dragleave", "drop"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.remove("dragover");
        });
      });

        }
      });

  };

  const switchModule = (moduleKey) => {

  const handleAction = (button) => {

    const id = button.dataset.id;

    switch (action) {
      case "switch-module":
        switchModule(button.dataset.module);
        break;
      case "switch-submodule":
        switchSubmodule(button.dataset.submodule);
        break;
      case "create":
        openRecordModal("create");
        break;
      case "edit":
        closeDrawer();
        openRecordModal("edit", id);
        break;
      case "view":
        openDrawer(id);
        break;
      case "duplicate":

        break;
      case "delete":
        deleteRecord(id);
        break;
      case "run-toggle":
        toggleRunState(id);
        break;
      case "copy-key":
        copyApiKey(id);
        break;
      case "close-drawer":
        closeDrawer();
        break;
      case "sort":
        if (ui.sortKey === button.dataset.sort) {
          ui.sortDirection = ui.sortDirection === "asc" ? "desc" : "asc";
        } else {
          ui.sortKey = button.dataset.sort;
          ui.sortDirection = "asc";
        }
        ui.page = 1;
        render();
        break;
      case "page":
        ui.page = Math.max(1, Number(button.dataset.page) || 1);
        render();
        break;
      case "clear-filter":
        ui.query = "";
        ui.statusFilter = "全部状态";
        ui.page = 1;
        render();
        break;
      case "export-csv":
        exportCsv();
        break;
      case "export-module":
        exportModuleData();
        break;
      case "export-report":
        exportModuleReport();
        break;
      case "import":

        break;
      case "save-settings":
        saveSettings();
        break;
      case "reset-settings":
        resetSettings();
        break;
      case "reset-all-data":
        resetAllData();
        break;
      case "infer":
        runInference();
        break;
      case "clear-inference":
        clearInference();
        break;
      default:
        break;
    }
  };

  const advanceBackgroundTasks = () => {
    let changed = false;
    const activePattern = /运行中|部署中|转换中|发布中|评测中|检查中|回放中|标注中/;

    Object.values(state.collections).forEach((records) => {
      if (!Array.isArray(records)) {
        return;
      }
      records.forEach((record) => {
        if (!activePattern.test(record.status || "") || record.progress === undefined || record.progress === "") {
          return;
        }
        const current = Number(record.progress) || 0;
        if (current >= 100) {
          if (record.status !== "已完成") {
            record.status = "已完成";
            record.updatedAt = nowText();
            changed = true;
          }
          return;
        }
        const increment = Math.max(1, Math.floor(Math.random() * 4));
        record.progress = Math.min(100, current + increment);
        if (record.loss !== undefined && Number.isFinite(Number(record.loss))) {
          record.loss = Math.max(0.01, Number((Number(record.loss) * 0.996).toFixed(3)));
        }
        if (record.progress >= 100) {
          record.status = "已完成";
        }
        record.updatedAt = nowText();
        changed = true;
      });
    });

    if (changed) {
      saveState();
      const activeSubmodule = getSubmodule();
      const activeElement = document.activeElement;
      const userIsEditing = dom.modalBackdrop.classList.contains("open")
        || ["INPUT", "SELECT", "TEXTAREA"].includes(activeElement?.tagName);
      if (["jobs", "imports"].includes(activeSubmodule.view) && !userIsEditing) {
        render();
      }
    }
  };

  /* ================================================================
   *  初始化与全局事件
   * ================================================================ */

  const refreshOperationalData = () => {
    (state.collections.nodes || []).forEach((node) => {
      if (node.status !== "离线" && node.status !== "维护") {
        const current = Number(node.utilization) || 0;
        node.utilization = Math.max(2, Math.min(98, current + Math.round(Math.random() * 8 - 4)));
        if (node.temperature !== undefined) {
          node.temperature = Math.max(35, Math.min(89, Number(node.temperature) + Math.round(Math.random() * 4 - 2)));
        }
        node.updatedAt = nowText();
      }
    });

    (state.collections.endpoints || []).forEach((endpoint) => {
      if (endpoint.status === "运行中" || endpoint.status === "灰度中") {
        endpoint.latency = Math.max(120, Math.min(650, Number(endpoint.latency || 400) + Math.round(Math.random() * 30 - 15)));
        endpoint.qps = Math.max(0, Number((Number(endpoint.qps || 0) + Math.random() * 2 - 1).toFixed(1)));
        endpoint.updatedAt = nowText();
      }
    });

    saveState();
    render();
    showToast("运行数据已刷新，节点与推理指标已更新。");
  };

  const initialize = () => {
    ensureAuxiliaryDom();

    const activeModule = getModule(ui.moduleKey);
    ui.moduleKey = activeModule.key;
    const activeSubmodule = getSubmodule(activeModule, ui.subKey);
    ui.subKey = activeSubmodule.key;

    $("header .title h1").textContent = state.settings.systemName || APP_NAME;

    dom.modalSubmit.addEventListener("click", submitRecord);
    dom.modalCancel.addEventListener("click", closeModal);
    dom.modalClose.addEventListener("click", closeModal);

    dom.modalBackdrop.addEventListener("click", (event) => {
      if (event.target === dom.modalBackdrop) {
        closeModal();
      }
    });

    dom.menu.addEventListener("click", () => {
      dom.sidebar.classList.toggle("open");
    });

    dom.refresh.addEventListener("click", refreshOperationalData);

    document.addEventListener("click", (event) => {
      const actionTarget = event.target.closest("[data-action]");
      if (!actionTarget) {
        return;
      }
      handleAction(actionTarget);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (dom.modalBackdrop.classList.contains("open")) {
          closeModal();
        } else {
          closeDrawer();
          dom.sidebar.classList.remove("open");
        }
      }

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        const settingsForm = document.getElementById("systemSettingsForm");
        if (settingsForm) {
          event.preventDefault();
          saveSettings();
        }
      }
    });

    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY && event.newValue) {
        try {
          state = mergeWithDefaults(JSON.parse(event.newValue));
          render();
          showToast("检测到其他窗口的数据更新，当前页面已同步。", 3200);
        } catch (error) {
          console.warn("跨窗口数据同步失败。", error);
        }
      }
    });

    window.addEventListener("beforeunload", () => {
      saveState();
      saveUiState();
    });

    render();
    setInterval(advanceBackgroundTasks, 15000);
  };

  initialize();
})();

  </script>
</body>
</html>
